[project]
name = "geojson-plotter"
version = "0.1.0"
description = "A reusable Mapflow GeoJSON/KML utility library for building analysis."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geojson_plotter"]
